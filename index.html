<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyectos inmobiliarios | Huancayo</title>
<style>
:root{--bg:#EEF0EC;--panel:#FBFBF8;--ink:#1D2B2F;--mute:#5E6E70;--line:#D3D9D3;--ok:#2F8F6B;--pre:#D8553A;--sold:#7E8790;--sel:#1D2B2F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A1C;--panel:#1A2528;--ink:#E8EEEA;--mute:#93A5A6;--line:#2C3B3E;--ok:#4DBE93;--pre:#EE7A5F;--sel:#E8EEEA}}
:root[data-theme="dark"]{--bg:#121A1C;--panel:#1A2528;--ink:#E8EEEA;--mute:#93A5A6;--line:#2C3B3E;--ok:#4DBE93;--pre:#EE7A5F;--sel:#E8EEEA}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);font-size:14px}
main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.chips{display:flex;gap:6px;padding:9px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chips+.chips{padding-top:0}
.filter-label{width:100%;font-size:11px;color:var(--mute);font-weight:700}
.chip{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#storage-status{display:none;margin:8px 12px;padding:8px 10px;border-radius:6px;background:#fff0e9;color:#9a4429;font-size:12px}
#storage-status.visible{display:block}
#list{overflow:auto;flex:1}
.item{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:12px;cursor:pointer;align-items:center}
.item:hover,.item.on{background:var(--bg)}
.item img{width:84px;height:62px;object-fit:cover;border-radius:6px;flex:none}
.item b{display:block;font-size:15px}.item span{font-size:13px;color:var(--mute)}
.item .item-meta{display:block}
.item .item-status{font-size:11px}
.item .item-type{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:2px 6px;margin:2px 5px 0 0;display:inline-block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#mapwrap{position:relative;min-height:0}
#project-map{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s ease;overflow:auto;padding:20px}
#drawer.open{transform:none}
#drawer h2{margin:0 0 2px;font-size:24px;letter-spacing:-.01em}
.close{position:absolute;top:12px;right:12px;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.facts div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.facts small{display:block;color:var(--mute);font-size:12px}.facts b{font-size:15px}
h3{font-size:15px;margin:20px 0 8px}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gal button{padding:0;border:0;background:none;cursor:pointer;position:relative;border-radius:8px;overflow:hidden}
.gal img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.gal span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000a);color:#fff;font-size:12px;padding:14px 8px 5px;text-align:left}
.docs button{display:flex;width:100%;gap:10px;align-items:center;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:6px;cursor:pointer;text-align:left}
.docs button:hover{background:var(--bg)}
.tag{font-size:11px;font-weight:700;background:var(--pre);color:#fff;border-radius:4px;padding:2px 6px}
.tag.image{background:var(--ok)}
.docs .remove-upload{width:auto;flex:none;margin:0 0 0 auto;padding:4px 8px;font-size:12px;color:var(--mute)}
.storage-error{color:#a3442b;font-size:12px;margin:8px 0}
.up{display:inline-block;margin-top:12px;font-size:14px;border:1.5px dashed var(--mute);border-radius:8px;padding:9px 14px;cursor:pointer}
.up:hover,.up:focus-within{border-color:var(--ink)}.up input{position:absolute;opacity:0;width:1px;height:1px}
.note{font-size:12px;color:var(--mute);margin:6px 0 0}
#modal{position:fixed;inset:0;background:#000c;display:none;z-index:9;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;flex-direction:column;gap:10px}
#modal.open{display:flex}
#modal .bar{display:flex;gap:10px;align-items:center;color:#fff;font-size:14px}
#modal .bar span{flex:1}#modal .bar a,#modal .bar button{font:inherit;color:#fff;background:#fff2;border:0;border-radius:8px;padding:6px 12px;text-decoration:none;cursor:pointer}
#modal .box{flex:1;min-height:0;display:flex;justify-content:center}
#modal img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#modal iframe{width:min(860px,100%);height:100%;border:0;background:#fff;border-radius:8px}
@media (max-width:760px){body{overflow:auto}main{flex:1;min-height:calc(100dvh - 94px);grid-template-columns:1fr;grid-template-rows:minmax(230px,35dvh) minmax(420px,1fr)}aside{border-right:0;border-bottom:1px solid var(--line);order:2;max-height:42dvh}#mapwrap{order:1}.item img{display:block}#drawer{width:min(440px,100%)}}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
:root{--bg:#F2F2F7;--panel:rgba(255,255,255,.94);--ink:#1C1C1E;--mute:#8E8E93;--line:rgba(60,60,67,.16);--ok:#34C759;--pre:#FF3B30;--sold:#8E8E93;--sel:#007AFF;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:rgba(28,28,30,.96);--ink:#F5F5F7;--mute:#98989D;--line:rgba(84,84,88,.65);--ok:#30D158;--pre:#FF453A;--sold:#8E8E93;--sel:#0A84FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--panel:rgba(28,28,30,.96);--ink:#F5F5F7;--mute:#98989D;--line:rgba(84,84,88,.65);--ok:#30D158;--pre:#FF453A;--sold:#8E8E93;--sel:#0A84FF;color-scheme:dark}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",sans-serif;letter-spacing:-.015em}
header{position:relative;z-index:2;align-items:center;padding:14px 22px;background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}
h1{letter-spacing:-.035em;font-size:23px}header p{letter-spacing:-.01em}
main{grid-template-columns:350px minmax(0,1fr)}
aside{background:var(--panel);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.chips{gap:7px;padding:10px 14px;border-color:var(--line)}
.chip{padding:7px 13px;border-radius:999px;border-color:var(--line);color:var(--sel);font-size:12px;font-weight:600;transition:background .18s,color .18s,transform .18s}
.chip:active,.item:active,.docs button:active{transform:scale(.98)}
.chip[aria-pressed=true]{background:var(--sel);color:#fff;border-color:var(--sel)}
.item{padding:12px 14px;gap:12px;border-color:var(--line);transition:background .16s,transform .16s}
.item img{border-radius:10px;background:var(--bg)}
.item:hover,.item.on{background:color-mix(in srgb,var(--sel) 8%,var(--panel))}
.item b{letter-spacing:-.025em}
.item .item-type{border-color:var(--line);border-radius:999px}
#mapwrap{overflow:hidden;background:var(--bg)}
#project-map{display:block}
#drawer{z-index:5;border:1px solid var(--line);border-right:0;border-radius:20px 0 0 20px;background:var(--panel);box-shadow:0 0 35px #00000016;backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px)}
#drawer h2{font-size:27px;letter-spacing:-.04em}
.close{position:sticky;top:0;float:right;margin:0 0 -36px;padding:8px 13px;border:0;border-radius:999px;background:color-mix(in srgb,var(--sel) 10%,var(--panel));color:var(--sel);font-size:13px;font-weight:600}
.facts div{border-color:var(--line);border-radius:12px;padding:10px 12px;background:color-mix(in srgb,var(--bg) 65%,var(--panel))}
.facts b{letter-spacing:-.02em}
.gal{gap:10px}
.gal button{border-radius:12px;background:var(--bg)}
.gal img{border-radius:12px}
.docs button{border-color:var(--line);border-radius:12px;padding:11px 12px;background:color-mix(in srgb,var(--panel) 86%,var(--bg));transition:transform .16s,background .16s}
.tag{border-radius:6px;background:#FF3B30}
.tag.image{background:#34C759}
.upload-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.up{margin-top:0;border:0;border-radius:999px;padding:10px 14px;background:color-mix(in srgb,var(--sel) 11%,var(--panel));color:var(--sel);font-size:12px;font-weight:600}
.up:hover,.up:focus-within{border:0;background:color-mix(in srgb,var(--sel) 17%,var(--panel))}
.up input:disabled+span{opacity:.5}
.note{line-height:1.5}
#storage-status{border-radius:12px;background:#FFF3CD;color:#8A5A00}
.storage-error{padding:10px 12px;border-radius:10px;background:#FFE5E5;color:#B42318;line-height:1.5}
#modal{background:rgba(0,0,0,.78);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}
#modal .bar button,#modal .bar a{border-radius:999px;background:rgba(255,255,255,.17)}
@media(max-width:760px){main{grid-template-columns:1fr;grid-template-rows:minmax(260px,38dvh) minmax(400px,1fr)}aside{max-height:none;border:0}.chips{padding:8px 12px}.chip{padding:6px 11px}.item{padding:10px 12px}#drawer{top:auto;left:0;right:0;bottom:0;width:100%;max-height:min(82dvh,760px);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;transform:translateY(102%);padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px))}#drawer.open{transform:translateY(0)}.close{top:0}header{padding:12px 16px}header p{font-size:12px}}
</style>
</head>
<body>
<header><h1>Proyectos en Huancayo</h1><p>Explora departamentos, lotes, casas y oficinas. Selecciona un proyecto para ver sus imágenes y documentos.</p></header>
<main>
<aside><div class="chips" id="type-chips"></div><div class="chips" id="status-chips"></div><div id="storage-status" role="status" aria-live="polite"></div><div id="list"></div></aside>
<div id="mapwrap">
<iframe id="project-map" title="Mapa de proyectos inmobiliarios en Google Maps, Huancayo y alrededores" src="https://www.google.com/maps/d/u/0/embed?mid=1z3UAFxo5r4fmKf4fb9zd2gHm_ZzVfX8&amp;ehbc=2E312F" width="640" height="480" allowfullscreen loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
<section id="drawer" aria-live="polite"></section>
</div>
</main>
<div id="modal" role="dialog" aria-modal="true"></div>
<script>
const COL={'Ejecución':'var(--ok)','Anteproyecto':'var(--build)','Sold Out':'var(--sold)'};
const P=[
{n:'SAN ANTONIO',d:'Huancayo',loc:'Av. San Antonio y Av. San Carlos',a:'Desde 49 m²',pr:'S/.235,000',t:'Departamentos',s:'Ejecución',h:195},
{n:'AGUIRRE 619',d:'El Tambo',loc:'Cerca al Parque Manzanos',a:'Desde 75 m²',pr:'S/.280,000',t:'Departamentos',s:'Ejecución',h:150},
{n:'TORRE BLANCA',d:'Pilcomayo',loc:'Coronel Parra 1840',a:'Desde 68 m²',pr:'S/.220,000',t:'Departamentos',s:'Ejecución',h:30},
{n:'ALAMEDA',d:'Huancayo',loc:'A unas cuadras del Nuevo Hospital La Libertad',a:'Desde 70 m²',pr:'S/.260,000',t:'Departamentos',s:'Ejecución',h:260},
{n:'JARDINES',d:'Huancayo',loc:'A una cuadra del Parque Tanquish',a:'Desde 36 m²',pr:'S/.141,000',t:'Departamentos',s:'Anteproyecto',h:350},
{n:'LOS SAUCES',d:'El Tambo',loc:'Cerca a la UNCP',a:'Desde 89 m²',pr:'S/.240,000',t:'Departamentos',s:'Sold Out',h:100},
{n:'LAS ISLAS',d:'El Tambo',loc:'Las Islas 541, Huancayo',a:'Desde 71.69 m²',pr:'',t:'Departamentos',s:'Sold Out',h:215},
{n:'LIMA 2',d:'El Tambo',loc:'El Tambo',a:'Desde 60 m²',pr:'',t:'Departamentos',s:'Ejecución',h:130},
{n:'LAS HUERTAS DE SICAYA',d:'Sicaya',loc:'A unas cuadras del estadio municipal de Sicaya',a:'Desde 90 m²',pr:'S/.39,000',t:'Lotes',s:'Ejecución',h:185},
{n:'LOS JARDINES DE LA HUAYCHA',d:'Mito',loc:'Mito',a:'Desde 90 m²',pr:'S/.45,000',t:'Lotes',s:'Anteproyecto',h:150},
{n:'LA PRADERA DE QUEPEPAMPA',d:'Chancay',loc:'Huaral',a:'Desde 120 m²',pr:'S/.26,000',t:'Lotes',s:'Sold Out',h:30},
{n:'LA LIBERTAD',d:'Sicaya',loc:'A 5 minutos de la plaza de Sicaya',a:'Desde 97 m²',pr:'',t:'Lotes',s:'Sold Out',h:260},
{n:'EL TREBOL',d:'Palian',loc:'Av. Agricultura, Palian',a:'Desde 90 m²',pr:'',t:'Lotes',s:'Sold Out',h:350},
{n:'SAN ISIDRO V',d:'Tres de Diciembre',loc:'Jr. La Amistad',a:'Desde 94 m²',pr:'',t:'Lotes',s:'Ejecución',h:100},
{n:'JOYA VERDE',d:'San Ramón',loc:'Cerca de la Playa La Auvernia, San Ramón',a:'Desde 203 m²',pr:'S/.15,000',t:'Casa de campo',s:'Anteproyecto',h:215},
{n:'MAGNOLIAS',d:'El Tambo',loc:'Calle Magnolias y Jr. Manchego Muñoz',a:'Desde 144 m²',pr:'S/.462,000',t:'Casas',s:'Ejecución',h:130},
{n:'HABITAT',d:'El Tambo',loc:'Jr. Manzanos y Calle Real',a:'Desde 30 m²',pr:'S/.113,000',t:'Oficinas',s:'Ejecución',h:30}
];
P.forEach((p,i)=>{p.id=i});
const $=q=>document.querySelector(q);
let sel=null,typeFilter='Todos',statusFilter='Todos',db=null;
const uploads=new Map();
const drawerUrls=[];
const modalUrls=[];
let storageError='';

function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function art(k,h){
 const c2=`hsl(${h} 30% 38%)`,sky=`hsl(${h} 40% 85%)`;let b='';
 if(k==0){b=`<rect x="100" y="36" width="200" height="190" fill="${c2}"/><rect x="40" y="150" width="70" height="76" fill="hsl(${h} 25% 52%)"/>`;
  for(let r=0;r<5;r++)for(let c=0;c<4;c++)b+=`<rect x="${116+c*46}" y="${50+r*32}" width="30" height="20" fill="#F6EBC8" opacity=".9"/>`;
  b+=`<rect x="180" y="190" width="40" height="36" fill="#1D2B2F"/><rect y="226" width="400" height="34" fill="#8E9A8F"/>`}
 if(k==1){b=`<rect x="50" y="30" width="300" height="200" fill="#fff" stroke="#1D2B2F" stroke-width="5"/><path d="M50 120H210M210 30V230M210 150H350M130 120V230" stroke="#1D2B2F" stroke-width="3" fill="none"/><rect x="220" y="40" width="40" height="30" fill="${sky}"/><text x="70" y="85" font-size="15" fill="#1D2B2F">Sala</text><text x="240" y="195" font-size="15" fill="#1D2B2F">Dorm.</text>`}
 if(k==2){b=`<rect y="150" width="400" height="110" fill="#5C98A8"/><circle cx="300" cy="110" r="28" fill="#F7C873"/><path d="M0 150H400" stroke="#fff6" stroke-width="3"/><rect x="30" y="70" width="50" height="100" fill="${c2}"/><rect x="90" y="40" width="40" height="130" fill="hsl(${h} 25% 30%)"/><rect x="140" y="90" width="55" height="80" fill="${c2}"/>`}
 if(k==3){b=`<rect y="160" width="400" height="100" fill="#D9C7A3"/><rect x="70" y="150" width="260" height="90" rx="30" fill="#4FB3C8"/><rect x="95" y="165" width="210" height="60" rx="22" fill="#7FD0E0"/><rect x="20" y="110" width="40" height="60" fill="#3E7D4F"/><rect x="340" y="100" width="40" height="70" fill="#3E7D4F"/>`}
 return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260"><rect width="400" height="260" fill="${sky}"/>${b}</svg>`);
}
const LAB=['Fachada','Planta tipo','Vista desde el piso 12','Zona de piscina'];

function makePDF(title,lines){
 const esc=s=>s.replace(/[\\()]/g,'\\$&');
 let c='BT /F1 22 Tf 56 770 Td ('+esc(title)+') Tj /F1 12 Tf';
 lines.forEach(l=>c+=' 0 -26 Td ('+esc(l)+') Tj');c+=' ET';
 const o=['<</Type/Catalog/Pages 2 0 R>>','<</Type/Pages/Kids[3 0 R]/Count 1>>','<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Contents 4 0 R/Resources<</Font<</F1 5 0 R>>>>>>','<</Length '+c.length+'>>stream\n'+c+'\nendstream','<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>'];
 let s='%PDF-1.4\n',off=[];
 o.forEach((b,i)=>{off.push(s.length);s+=(i+1)+' 0 obj\n'+b+'\nendobj\n'});
 const x=s.length;
 s+='xref\n0 6\n0000000000 65535 f \n'+off.map(n=>String(n).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+x+'\n%%EOF';
 const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i)&255;
 return new Blob([u],{type:'application/pdf'});
}
function docs(p){return[
 ['Ficha del proyecto',p.n+' - '+p.d,[p.t,p.a,p.pr||'Precio a consultar','Estado: '+p.s,'Ubicación: '+p.loc,'Documento de demostración.']]]}

function renderChips(){
 const types=['Todos','Departamentos','Lotes','Casa de campo','Casas','Oficinas'];
 const statuses=['Todos','Ejecución','Anteproyecto','Sold Out'];
 $('#type-chips').innerHTML='<span class="filter-label">Tipo de proyecto</span>'+types.map(f=>`<button class="chip" aria-pressed="${f==typeFilter}" data-type="${f}">${f}</button>`).join('');
 $('#status-chips').innerHTML='<span class="filter-label">Estado</span>'+statuses.map(f=>`<button class="chip" aria-pressed="${f==statusFilter}" data-status="${f}">${f}</button>`).join('');
 $('#type-chips').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.type;renderChips();renderAll()});
 $('#status-chips').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;renderChips();renderAll()});
}
const vis=()=>P.filter(p=>(typeFilter=='Todos'||p.t==typeFilter)&&(statusFilter=='Todos'||p.s==statusFilter));
function renderAll(){
 const shown=vis();
 $('#list').innerHTML=shown.map(p=>`<button class="item ${sel===p.id?'on':''}" data-i="${p.id}"><img alt="" src="${art(0,p.h)}"><div><b>${html(p.n)}</b><span class="item-meta">${html(p.d)} · ${html(p.pr||'Precio a consultar')}</span><span class="item-type">${html(p.t)}</span><span class="item-status"><i class="dot" style="background:${COL[p.s]}"></i>${html(p.s)}</span></div></button>`).join('');
 document.querySelectorAll('[data-i]').forEach(e=>{e.onclick=()=>open(+e.dataset.i);e.onkeydown=ev=>{if(ev.key=='Enter'||ev.key==' '){ev.preventDefault();open(+e.dataset.i)}}});
}
function open(i){sel=i;renderAll();drawer()}
function releaseDrawerUrls(){while(drawerUrls.length)URL.revokeObjectURL(drawerUrls.pop())}
function releaseModalUrls(){while(modalUrls.length)URL.revokeObjectURL(modalUrls.pop())}
function setStorageError(message){storageError=message;const status=$('#storage-status');status.textContent=message;status.classList.toggle('visible',Boolean(message))}
function makeId(){return self.crypto&&crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random().toString(16).slice(2)}`}
function openUploadDatabase(){
 return new Promise((resolve,reject)=>{
  if(!('indexedDB' in self)){reject(new Error('Este navegador no permite guardar archivos de forma persistente.'));return}
  const request=indexedDB.open('habitat-huancayo-files',1);
  request.onupgradeneeded=()=>{const database=request.result;const store=database.createObjectStore('uploads',{keyPath:'id'});store.createIndex('projectId','projectId',{unique:false})};
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('No se pudo abrir el almacenamiento local.'));
  request.onblocked=()=>reject(new Error('El almacenamiento está ocupado por otra pestaña. Ciérrala e inténtalo de nuevo.'));
 });
}
function transactionDone(transaction){
 return new Promise((resolve,reject)=>{
  transaction.oncomplete=()=>resolve();
  transaction.onerror=()=>reject(transaction.error||new Error('Falló el guardado local.'));
  transaction.onabort=()=>reject(transaction.error||new Error('Se canceló el guardado local.'));
 });
}
function readSavedUploads(){
 return new Promise((resolve,reject)=>{
  const transaction=db.transaction('uploads','readonly'),request=transaction.objectStore('uploads').getAll();
  request.onsuccess=()=>resolve(request.result);
  request.onerror=()=>reject(request.error||new Error('No se pudieron recuperar los archivos guardados.'));
 });
}
async function initializeStorage(){
 try{
  db=await openUploadDatabase();
  const saved=await readSavedUploads();
  saved.forEach(file=>{const list=uploads.get(file.projectId)||[];list.push(file);uploads.set(file.projectId,list)});
  renderAll();
  if(sel!==null)drawer();
 }catch(error){
  db=null;
  setStorageError(`No se pudo activar el guardado permanente: ${error.message}`);
 }
}
async function saveUploads(projectId,files){
 if(!db)throw new Error('El guardado permanente no está disponible en este navegador.');
 const records=files.map(file=>({id:makeId(),projectId,name:file.name,type:file.type,blob:file,createdAt:Date.now()}));
 const transaction=db.transaction('uploads','readwrite'),done=transactionDone(transaction),store=transaction.objectStore('uploads');
 try{records.forEach(record=>store.add(record));await done}
 catch(error){throw new Error(`No se pudieron guardar los archivos. Comprueba el espacio disponible. ${error.message}`)}
 const current=uploads.get(projectId)||[];
 uploads.set(projectId,[...current,...records]);
}
async function replaceGallery(projectId,files){
 if(!db)throw new Error('El guardado permanente no está disponible en este navegador.');
 const old=uploads.get(projectId)||[];
 const images=old.filter(file=>file.type.startsWith('image/'));
 const records=files.map(file=>({id:makeId(),projectId,name:file.name,type:file.type,blob:file,createdAt:Date.now()}));
 const transaction=db.transaction('uploads','readwrite'),done=transactionDone(transaction),store=transaction.objectStore('uploads');
 try{
  images.forEach(file=>store.delete(file.id));
  records.forEach(record=>store.add(record));
  await done;
 }catch(error){throw new Error(`No se pudo reemplazar la galería. Comprueba el espacio disponible. ${error.message}`)}
 uploads.set(projectId,[...old.filter(file=>!file.type.startsWith('image/')),...records]);
}
function drawer(){
 const p=P[sel],dr=$('#drawer');
 releaseDrawerUrls();
 const saved=uploads.get(p.id)||[];
 const uploadedImages=saved.filter(file=>file.type.startsWith('image/')).map(file=>{const url=URL.createObjectURL(file.blob);drawerUrls.push(url);return{src:url,l:file.name}});
 const pdfs=saved.filter(file=>file.type==='application/pdf');
 const imgs=uploadedImages.length?uploadedImages:[0,1,2,3].map(k=>({src:art(k,p.h),l:LAB[k]}));
 dr.innerHTML=`<button class="close" id="x">Cerrar</button><h2>${html(p.n)}</h2><div style="color:var(--mute)"><i class="dot" style="background:${COL[p.s]}"></i>${html(p.s)} · ${html(p.d)}</div><p class="note">${html(p.loc)}</p>
 <div class="facts"><div><small>Tipo</small><b>${html(p.t)}</b></div><div><small>Estado</small><b>${html(p.s)}</b></div><div><small>Precio</small><b>${html(p.pr||'Consultar')}</b></div><div><small>Área</small><b>${html(p.a)}</b></div></div>
 <h3>Galería ${uploadedImages.length?`<span class="gallery-count">${uploadedImages.length} imágenes</span>`:''}</h3><div class="gal">${imgs.map((m,k)=>`<button data-g="${k}"><img alt="${html(m.l)}" src="${m.src}"><span>${html(m.l)}</span></button>`).join('')}</div>
 <h3>Documentos</h3><div class="docs">${docs(p).map((d,k)=>`<button data-d="${k}"><span class="tag">PDF</span>${html(d[0])}</button>`).join('')}${pdfs.map((file,k)=>`<button data-u="${k}"><span class="tag ${file.type.startsWith('image/')?'image':''}">${file.type.startsWith('image/')?'IMG':'PDF'}</span>${html(file.name)}</button>`).join('')}</div>
 <div class="upload-actions"><label class="up">↻ Reemplazar galería<input type="file" id="gallery-upload" multiple accept="image/*" ${db?'':'disabled'}></label><label class="up">＋ Agregar PDF<input type="file" id="pdf-upload" multiple accept="application/pdf" ${db?'':'disabled'}></label></div>
 <p class="note">La nueva galería reemplaza las ilustraciones de muestra. Las imágenes y PDF se guardan en este navegador.</p>${storageError?`<p class="storage-error" role="alert">${html(storageError)}</p>`:''}`;
 dr.classList.add('open');
 $('#x').onclick=()=>{sel=null;dr.classList.remove('open');releaseDrawerUrls();renderAll()};
 dr.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>show('img',imgs[b.dataset.g].src,imgs[b.dataset.g].l));
 dr.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const d=docs(p)[Number(b.dataset.d)];show('pdf',makePDF(d[1],d[2]),d[0])});
 dr.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>show('pdf',pdfs[Number(b.dataset.u)].blob,pdfs[Number(b.dataset.u)].name));
 $('#gallery-upload').onchange=async e=>{
  const selected=[...e.target.files],images=selected.filter(file=>file.type.startsWith('image/'));
  if(selected.length!==images.length)setStorageError('Se omitieron los archivos que no son imágenes.');
  if(!images.length){if(selected.length)drawer();return}
  try{
   await replaceGallery(p.id,images);
   if(selected.length!==images.length)setStorageError('La galería se reemplazó con las imágenes compatibles.');
   else setStorageError('');
   if(sel===p.id)drawer();
  }catch(error){setStorageError(error.message);if(sel===p.id)drawer()}
 };
 $('#pdf-upload').onchange=async e=>{
  const selected=[...e.target.files],pdfs=selected.filter(file=>file.type==='application/pdf');
  if(selected.length!==pdfs.length)setStorageError('Se omitieron los archivos que no son PDF.');
  if(!pdfs.length){if(selected.length)drawer();return}
  try{
   await saveUploads(p.id,pdfs);
   if(selected.length!==pdfs.length)setStorageError('Se guardaron los PDF compatibles; se omitieron los otros formatos.');
   else setStorageError('');
   if(sel===p.id)drawer();
  }catch(error){setStorageError(error.message);if(sel===p.id)drawer()}
 };
}
function show(kind,source,title){
 releaseModalUrls();
 const url=source instanceof Blob?URL.createObjectURL(source):source;
 if(source instanceof Blob)modalUrls.push(url);
 const m=$('#modal');
 m.innerHTML=`<div class="bar"><span>${html(title)}</span>${kind=='pdf'?`<a href="${url}" target="_blank" rel="noopener">Abrir en otra pestaña</a>`:''}<button id="mx">Cerrar</button></div><div class="box">${kind=='img'?`<img alt="${html(title)}" src="${url}">`:`<iframe title="${html(title)}" src="${url}"></iframe>`}</div>`;
 m.classList.add('open');$('#mx').onclick=closeModal;
}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML='';releaseModalUrls()}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});
renderChips();renderAll();initializeStorage();
</script>
</body>
