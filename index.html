<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Proyectos inmobiliarios | Huancayo</title>
<script src="supabase-config.js"></script>
<style>
:root{--bg:#EEF0EC;--panel:#FBFBF8;--ink:#1D2B2F;--mute:#5E6E70;--line:#D3D9D3;--ok:#2F8F6B;--pre:#D8553A;--sold:#7E8790;--sel:#1D2B2F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121A1C;--panel:#1A2528;--ink:#E8EEEA;--mute:#93A5A6;--line:#2C3B3E;--ok:#4DBE93;--pre:#EE7A5F;--sel:#E8EEEA}}
:root[data-theme="dark"]{--bg:#121A1C;--panel:#1A2528;--ink:#E8EEEA;--mute:#93A5A6;--line:#2C3B3E;--ok:#4DBE93;--pre:#EE7A5F;--sel:#E8EEEA}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{padding:14px 20px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--mute);font-size:14px}
#account-area{display:flex;align-items:center;gap:10px;margin-left:auto}
#account-status{max-width:220px;overflow:hidden;color:var(--mute);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
#account-button{padding:8px 14px;border:0;border-radius:999px;background:var(--sel);color:#fff;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
main{flex:1;display:grid;grid-template-columns:330px 1fr;min-height:0}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.chips{display:flex;gap:6px;padding:9px 12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.chips+.chips{padding-top:0}
.filter-label{width:100%;font-size:11px;color:var(--mute);font-weight:700}
.chip{font:inherit;font-size:13px;padding:5px 11px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:99px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#storage-status{display:none;margin:8px 12px;padding:8px 10px;border-radius:6px;background:#fff0e9;color:#9a4429;font-size:12px}
#storage-status.visible{display:block}
#list{overflow:auto;flex:1}
.item{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:12px;cursor:pointer;align-items:center}
.item:hover,.item.on{background:var(--bg)}
.item img{width:84px;height:62px;object-fit:cover;border-radius:6px;flex:none}
.item .thumbnail-placeholder{width:84px;height:62px;display:grid;place-items:center;flex:none;border-radius:10px;background:color-mix(in srgb,var(--sel) 9%,var(--panel));color:var(--mute);font-size:10px;text-align:center}
.item b{display:block;font-size:15px}.item span{font-size:13px;color:var(--mute)}
.item .item-meta{display:block}
.item .item-status{font-size:11px}
.item .item-type{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:2px 6px;margin:2px 5px 0 0;display:inline-block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#mapwrap{position:relative;min-height:0}
#project-map{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg)}
#drawer{position:absolute;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .25s ease;overflow:auto;padding:20px}
#drawer.open{transform:none}
#drawer h2{margin:0 0 2px;font-size:24px;letter-spacing:-.01em}
.close{position:absolute;top:12px;right:12px;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
.facts div{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.facts small{display:block;color:var(--mute);font-size:12px}.facts b{font-size:15px}
h3{font-size:15px;margin:20px 0 8px}
.gallery-category{margin:14px 0 18px}
.gallery-category h4{margin:0 0 8px;color:var(--mute);font-size:13px;font-weight:600}
.project-cover{position:relative;width:100%;margin:0 0 16px;padding:0;overflow:hidden;border:0;border-radius:14px;background:var(--bg);cursor:pointer}
.project-cover img{display:block;width:100%;max-height:230px;aspect-ratio:16/9;object-fit:cover}
.project-cover span{position:absolute;right:0;bottom:0;left:0;padding:28px 12px 10px;background:linear-gradient(transparent,#000b);color:#fff;text-align:left;font-size:12px;font-weight:600}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gallery-card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 86%,var(--bg))}
.gal button.gallery-image{width:100%;padding:0;border:0;background:none;cursor:pointer;position:relative;overflow:hidden}
.gal img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block}
.gal span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,#000a);color:#fff;font-size:12px;padding:14px 8px 5px;text-align:left}
.gal button .cover-badge{right:auto;bottom:auto;left:7px}
.gal button .image-name{left:0;right:0;bottom:0}
.cover-badge{position:absolute;top:7px;left:7px;padding:4px 7px;border-radius:999px;background:#007AFF;color:white;font-size:10px;font-weight:700}
.image-actions{display:flex;gap:6px;padding:6px}
.image-actions button{flex:1;padding:6px 7px;border:0;border-radius:999px;background:color-mix(in srgb,var(--sel) 10%,var(--panel));color:var(--sel);font:inherit;font-size:10px;font-weight:600;cursor:pointer}
.image-actions button.delete-asset{flex:0 0 auto;background:#FF3B3017;color:#D93025}
.empty-category{margin:0;padding:8px 0;color:var(--mute);font-size:12px}
.upload-form{display:grid;gap:9px;margin-top:12px;padding:13px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 86%,var(--bg))}
.upload-form label{display:grid;gap:5px;color:var(--mute);font-size:11px;font-weight:600}
.upload-form select,.upload-form input[type=text]{width:100%;min-height:38px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px}
.upload-form input[type=file]{max-width:100%;font-size:12px}
.replace-option{display:flex!important;grid-template-columns:18px 1fr;align-items:center;gap:8px!important;color:var(--ink)!important;font-size:12px!important}
.replace-option input{width:16px;height:16px;accent-color:var(--sel)}
.upload-submit{padding:9px 13px;border:0;border-radius:999px;background:var(--sel);color:white;font:inherit;font-weight:600;cursor:pointer}
.docs button{display:flex;width:100%;gap:10px;align-items:center;font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:6px;cursor:pointer;text-align:left}
.docs button:hover{background:var(--bg)}
.document-row{display:flex;align-items:center;gap:6px}
.document-row>button:first-child{flex:1}
.document-row>.delete-asset{width:34px;flex:0 0 34px;justify-content:center;border-color:transparent;color:#D93025}
.tag{font-size:11px;font-weight:700;background:var(--pre);color:#fff;border-radius:4px;padding:2px 6px}
.tag.image{background:var(--ok)}
.docs .remove-upload{width:auto;flex:none;margin:0 0 0 auto;padding:4px 8px;font-size:12px;color:var(--mute)}
.storage-error{color:#a3442b;font-size:12px;margin:8px 0}
.up{display:inline-block;margin-top:12px;font-size:14px;border:1.5px dashed var(--mute);border-radius:8px;padding:9px 14px;cursor:pointer}
.up:hover,.up:focus-within{border-color:var(--ink)}.up input{position:absolute;opacity:0;width:1px;height:1px}
.project-location{font-size:12px;color:var(--mute);margin:6px 0 0}
.auth-card{width:min(420px,100%);margin:auto;padding:22px;border:1px solid rgba(255,255,255,.2);border-radius:20px;background:var(--panel);color:var(--ink);box-shadow:0 18px 55px #0004}
.auth-card h2{margin:0 0 8px;font-size:21px}
.auth-card p{color:var(--mute);font-size:13px;line-height:1.5}
.auth-card label{display:grid;gap:5px;margin-top:12px;color:var(--mute);font-size:12px}
.auth-card input{padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit}
.auth-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}
.auth-actions button{padding:9px 14px;border:0;border-radius:999px;background:var(--sel);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.auth-actions button.secondary{background:color-mix(in srgb,var(--sel) 10%,var(--panel));color:var(--sel)}
.auth-actions button:disabled{opacity:.6;cursor:wait}
#auth-error{color:#B42318}
#modal{position:fixed;inset:0;background:#000c;display:none;z-index:9;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px;flex-direction:column;gap:10px}
#modal.open{display:flex}
#modal .bar{display:flex;gap:10px;align-items:center;color:#fff;font-size:14px}
#modal .bar span{flex:1}#modal .bar a,#modal .bar button{font:inherit;color:#fff;background:#fff2;border:0;border-radius:8px;padding:6px 12px;text-decoration:none;cursor:pointer}
#modal .box{flex:1;min-height:0;display:flex;justify-content:center}
#modal img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
#modal iframe{width:min(860px,100%);height:100%;border:0;background:#fff;border-radius:8px}
@media (max-width:760px){body{overflow:auto}main{flex:1;min-height:calc(100dvh - 94px);grid-template-columns:1fr;grid-template-rows:minmax(230px,35dvh) minmax(420px,1fr)}aside{border-right:0;border-bottom:1px solid var(--line);order:2;max-height:42dvh}#mapwrap{order:1}.item img{display:block}#drawer{width:min(440px,100%)}}
@media (prefers-reduced-motion:reduce){#drawer{transition:none}}
:root{--bg:#F2F2F7;--panel:rgba(255,255,255,.94);--ink:#1C1C1E;--mute:#8E8E93;--line:rgba(60,60,67,.16);--ok:#34C759;--pre:#FF3B30;--sold:#8E8E93;--sel:#007AFF;color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",sans-serif;letter-spacing:-.015em}
header{position:relative;z-index:2;align-items:center;padding:14px 22px;background:color-mix(in srgb,var(--panel) 84%,transparent);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px)}

.gal{gap:10px}
.docs button{border-color:var(--line);border-radius:12px;padding:11px 12px;background:color-mix(in srgb,var(--panel) 86%,var(--bg));transition:transform .16s,background .16s}

.tag.image{background:#34C759}

.up:hover,.up:focus-within{border:0;background:color-mix(in srgb,var(--sel) 17%,var(--panel))}
.up input:disabled+span{opacity:.5}

.item img,.item .thumbnail-placeholder,.project-cover,.project-cover img,.gallery-card,.gal button.gallery-image,.gal img,#modal img{border-radius:0!important;box-shadow:none!important}

</style>

<body>
<header><h1>Proyectos en Huancayo</h1><p>Explora departamentos, lotes, casas y oficinas. Selecciona un proyecto para ver sus imágenes y documentos.</p><div id="account-area"><span id="account-status">Conectando almacenamiento…</span><button id="account-button" type="button">Iniciar sesión</button></div></header>
<main>
<aside><div class="chips" id="type-chips"></div><div class="chips" id="status-chips"></div><div id="storage-status" role="status" aria-live="polite"></div><div id="list"></div></aside>
<div id="mapwrap">
<iframe id="project-map" title="Mapa de proyectos inmobiliarios en Google Maps, Huancayo y alrededores" src="https://www.google.com/maps/d/u/0/embed?mid=1z3UAFxo5r4fmKf4fb9zd2gHm_ZzVfX8&amp;ehbc=2E312F" width="640" height="480" allowfullscreen loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
<section id="drawer" aria-live="polite"></section>
</div>
</main>
<div id="modal" role="dialog" aria-modal="true"></div>
<script type="module">
const COL={'Ejecución':'var(--ok)','Anteproyecto':'var(--build)','Sold Out':'var(--sold)'};
const P=[
{n:'SAN ANTONIO',d:'Huancayo',loc:'Av. San Antonio y Av. San Carlos',a:'Desde 49 m²',pr:'S/.235,000',t:'Departamentos',s:'Ejecución',h:195},
{n:'AGUIRRE 619',d:'El Tambo',loc:'Cerca al Parque Manzanos',a:'Desde 75 m²',pr:'S/.280,000',t:'Departamentos',s:'Ejecución',h:150},
{n:'TORRE BLANCA',d:'Pilcomayo',loc:'Coronel Parra 1840',a:'Desde 68 m²',pr:'S/.220,000',t:'Departamentos',s:'Ejecución',h:30},
{n:'ALAMEDA',d:'Huancayo',loc:'A unas cuadras del Nuevo Hospital La Libertad',a:'Desde 70 m²',pr:'S/.260,000',t:'Departamentos',s:'Ejecución',h:260},
{n:'JARDINES',d:'Huancayo',loc:'A una cuadra del Parque Tanquish',a:'Desde 36 m²',pr:'S/.141,000',t:'Departamentos',s:'Anteproyecto',h:350},
{n:'LOS SAUCES',d:'El Tambo',loc:'Cerca a la UNCP',a:'Desde 89 m²',pr:'S/.240,000',t:'Departamentos',s:'Sold Out',h:100},
{n:'LAS ISLAS',d:'El Tambo',loc:'Las Islas 541, Huancayo',a:'Desde 71.69 m²',pr:'',t:'Departamentos',s:'Sold Out',h:215},
{n:'LIMA 2',d:'El Tambo',loc:'El Tambo',a:'Desde 60 m²',pr:'',t:'Departamentos',s:'Ejecución',h:130},
{n:'LAS HUERTAS DE SICAYA',d:'Sicaya',loc:'A unas cuadras del estadio municipal de Sicaya',a:'Desde 90 m²',pr:'S/.39,000',t:'Lotes',s:'Ejecución',h:185},
{n:'LOS JARDINES DE LA HUAYCHA',d:'Mito',loc:'Mito',a:'Desde 90 m²',pr:'S/.45,000',t:'Lotes',s:'Anteproyecto',h:150},
{n:'LA PRADERA DE QUEPEPAMPA',d:'Chancay',loc:'Huaral',a:'Desde 120 m²',pr:'S/.26,000',t:'Lotes',s:'Sold Out',h:30},
{n:'LA LIBERTAD',d:'Sicaya',loc:'A 5 minutos de la plaza de Sicaya',a:'Desde 97 m²',pr:'',t:'Lotes',s:'Sold Out',h:260},
{n:'EL TREBOL',d:'Palian',loc:'Av. Agricultura, Palian',a:'Desde 90 m²',pr:'',t:'Lotes',s:'Sold Out',h:350},
{n:'SAN ISIDRO V',d:'Tres de Diciembre',loc:'Jr. La Amistad',a:'Desde 94 m²',pr:'',t:'Casa de campo',s:'Ejecución',h:100},
{n:'JOYA VERDE',d:'San Ramón',loc:'Cerca de la Playa La Auvernia, San Ramón',a:'Desde 203 m²',pr:'S/.15,000',t:'Casa de campo',s:'Anteproyecto',h:215},
{n:'MAGNOLIAS',d:'El Tambo',loc:'Calle Magnolias y Jr. Manchego Muñoz',a:'Desde 144 m²',pr:'S/.462,000',t:'Oficinas',s:'Ejecución',h:130},
{n:'HABITAT',d:'El Tambo',loc:'Jr. Manzanos y Calle Real',a:'Desde 30 m²',pr:'S/.113,000',t:'Oficinas',s:'Ejecución',h:30}
];
P.forEach(p=>{p.id=p.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')});
const $=q=>document.querySelector(q);
const SUPABASE_BUCKET=window.HABITAT_SUPABASE_BUCKET||'project-files';
let supabase=null,currentUser=null,isProjectAdmin=false,sel=null,typeFilter='Todos',statusFilter='Todos';
let assetsByProject=new Map(),storageMessage='Conectando con el almacenamiento compartido…';
let selectedGalleryFiles=[],selectedPdfFiles=[];
let modalObjectUrl=null;

function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function coverCategory(project){return project.t==='Lotes'||project.t==='Casa de campo'?'portico':'fachada'}
function categoryName(category){return({fachada:'Fachada',portico:'Pórtico',areas_comunes:'Áreas comunes',tipologia_departamento:'Tipologías de departamentos',documento:'Documento'})[category]||category}
function projectAssets(projectId){return assetsByProject.get(projectId)||[]}
function publicFileUrl(asset){return supabase.storage.from(SUPABASE_BUCKET).getPublicUrl(asset.file_path).data.publicUrl}
function primaryImage(project){
 const images=projectAssets(project.id).filter(asset=>asset.mime_type.startsWith('image/'));
 return images.find(asset=>asset.is_primary)||images.find(asset=>asset.category===coverCategory(project))||null;
}

function renderChips(){
 const types=['Todos','Departamentos','Lotes','Casa de campo','Casas','Oficinas'];
 const statuses=['Todos','Ejecución','Anteproyecto','Sold Out'];
 $('#type-chips').innerHTML='<span class="filter-label">Tipo de proyecto</span>'+types.map(f=>`<button class="chip" aria-pressed="${f==typeFilter}" data-type="${f}">${f}</button>`).join('');
 $('#status-chips').innerHTML='<span class="filter-label">Estado</span>'+statuses.map(f=>`<button class="chip" aria-pressed="${f==statusFilter}" data-status="${f}">${f}</button>`).join('');
 $('#type-chips').querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{typeFilter=b.dataset.type;renderChips();renderAll()});
 $('#status-chips').querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{statusFilter=b.dataset.status;renderChips();renderAll()});
}
const vis=()=>P.filter(p=>(typeFilter=='Todos'||p.t==typeFilter)&&(statusFilter=='Todos'||p.s==statusFilter));
function renderAll(){
 const shown=vis();
 $('#list').innerHTML=shown.map(p=>{
  const cover=primaryImage(p);
  const thumbnail=cover?`<img alt="${html(cover.file_name)}" src="${html(publicFileUrl(cover))}">`:`<span class="thumbnail-placeholder">${html(coverCategory(p)==='portico'?'Pórtico':'Fachada')}</span>`;
  return `<button class="item ${sel===p.id?'on':''}" data-i="${html(p.id)}">${thumbnail}<span class="item-summary"><b>${html(p.n)}</b><span class="item-meta">${html(p.d)} · ${html(p.pr||'Precio a consultar')}</span><span class="item-type">${html(p.t)}</span><span class="item-status"><i class="dot" style="background:${COL[p.s]}"></i>${html(p.s)}</span></span></button>`;
 }).join('');
 document.querySelectorAll('[data-i]').forEach(e=>{e.onclick=()=>open(e.dataset.i);e.onkeydown=ev=>{if(ev.key=='Enter'||ev.key==' '){ev.preventDefault();open(e.dataset.i)}}});
}
function open(projectId){if(!P.some(project=>project.id===projectId))return;sel=projectId;renderAll();drawer()}
function setStorageMessage(message){storageMessage=message;$('#storage-status').textContent=message;$('#storage-status').classList.toggle('visible',Boolean(message))}
function groupAssets(project){
 const images=projectAssets(project.id).filter(asset=>asset.mime_type.startsWith('image/'));
 const groups=[
  {category:coverCategory(project),label:categoryName(coverCategory(project)),assets:images.filter(asset=>asset.category===coverCategory(project))},
  {category:'areas_comunes',label:'Áreas comunes',assets:images.filter(asset=>asset.category==='areas_comunes')}
 ];
 if(project.t==='Departamentos'){
  const typologies=new Map();
  images.filter(asset=>asset.category==='tipologia_departamento').forEach(asset=>{
   const label=asset.category_label.trim()||'Otra tipología';
   if(!typologies.has(label))typologies.set(label,[]);
   typologies.get(label).push(asset);
  });
  if(typologies.size){
   groups.push(...[...typologies].sort(([a],[b])=>a.localeCompare(b,'es')).map(([label,assets])=>({category:'tipologia_departamento',label:`Tipología · ${label}`,assets})));
  }else groups.push({category:'tipologia_departamento',label:'Tipologías de departamentos',assets:[]});
 }
 return groups;
}
function updateAccountUi(){
 const button=$('#account-button'),status=$('#account-status');
 if(!supabase){
  button.textContent='Sin conexión';
  button.disabled=true;
  status.textContent='Configura Supabase para archivos compartidos';
  return;
 }
 button.disabled=false;
 button.textContent=currentUser?'Cerrar sesión':'Iniciar sesión';
 status.textContent=currentUser?(isProjectAdmin?`Administrador · ${currentUser.email}`:`Solo lectura · ${currentUser.email}`):'Supabase conectado';
}
async function refreshAssets(){
 if(!supabase)return;
 const {data,error}=await supabase.from('project_assets')
  .select('id,project_id,category,category_label,file_path,file_name,mime_type,is_primary,created_at')
  .order('created_at',{ascending:true});
 if(error)throw new Error(`No se pudo cargar la galería compartida: ${error.message}`);
 assetsByProject=new Map();
 data.forEach(asset=>{
  const list=assetsByProject.get(asset.project_id)||[];
  list.push(asset);
  assetsByProject.set(asset.project_id,list);
 });
 renderAll();
 if(sel!==null)drawer();
}
async function syncUser(session){
 currentUser=session?.user||null;
 isProjectAdmin=false;
 if(currentUser){
  const {data,error}=await supabase.from('project_admins').select('user_id').eq('user_id',currentUser.id).maybeSingle();
  if(error)throw new Error(`No se pudo verificar el rol de administración: ${error.message}`);
  isProjectAdmin=Boolean(data);
 }
 updateAccountUi();
}
async function initializeCloud(){
 const url=String(window.HABITAT_SUPABASE_URL||'').trim();
 const anonKey=String(window.HABITAT_SUPABASE_ANON_KEY||'').trim();
 if(!url||!anonKey){
  setStorageMessage('Configura Supabase para compartir imágenes y PDF entre dispositivos.');
  updateAccountUi();
  return;
 }
 try{
  const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2');
  supabase=createClient(url,anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  updateAccountUi();
  supabase.auth.onAuthStateChange((_event,session)=>{
   queueMicrotask(async()=>{
    try{
     await syncUser(session);
     await refreshAssets();
     setStorageMessage('');
    }catch(error){setStorageMessage(`Error de sincronización: ${error.message}`)}
   });
  });
  const {data,error}=await supabase.auth.getSession();
  if(error)throw error;
  await syncUser(data.session);
  await refreshAssets();
  setStorageMessage('');
 }catch(error){
  updateAccountUi();
  setStorageMessage(`No se pudo inicializar Supabase: ${error.message}`);
 }
}
function uploadCategories(project){
 const cover=coverCategory(project);
 const categories=[
  {value:cover,label:categoryName(cover)},
  {value:'areas_comunes',label:'Áreas comunes'}
 ];
 if(project.t==='Departamentos')categories.push({value:'tipologia_departamento',label:'Tipología de departamentos'});
 return categories;
}
function isSupportedImage(file){
 return ['image/jpeg','image/png','image/webp','image/gif','image/avif'].includes(file.type);
}
function validateFiles(files,kind){
 if(!isProjectAdmin)throw new Error('Inicia sesión con una cuenta administradora para subir archivos.');
 if(!files.length)throw new Error('Selecciona al menos un archivo.');
 const invalid=files.find(file=>kind==='image'?!isSupportedImage(file):file.type!=='application/pdf');
 if(invalid)throw new Error(`El formato de "${invalid.name}" no está admitido.`);
 const oversized=files.find(file=>file.size>25*1024*1024);
 if(oversized)throw new Error(`"${oversized.name}" supera el límite de 25 MB.`);
}
function safeFileName(name){return name.normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')||'archivo'}
async function uploadFile(project,file){
 const assetId=crypto.randomUUID();
 const filePath=`${project.id}/${assetId}-${safeFileName(file.name)}`;
 const {data,error}=await supabase.storage.from(SUPABASE_BUCKET).upload(filePath,file,{contentType:file.type,upsert:false});
 if(error)throw new Error(`No se pudo subir "${file.name}": ${error.message}`);
 return {id:assetId,project_id:project.id,file_path:data.path,file_name:file.name,mime_type:file.type};
}
async function removeStoredFiles(paths){
 if(!paths.length)return;
 const {error}=await supabase.storage.from(SUPABASE_BUCKET).remove(paths);
 if(error)throw new Error(`Los metadatos se actualizaron, pero algunos archivos no se pudieron borrar del almacenamiento: ${error.message}`);
}
async function uploadImages(project,files,category,typology,replaceAll){
 validateFiles(files,'image');
 if(category==='tipologia_departamento'&&!typology.trim())throw new Error('Indica el nombre de la tipología para organizar estas imágenes.');
 if(!uploadCategories(project).some(option=>option.value===category))throw new Error('La categoría elegida no corresponde al proyecto.');
 if(replaceAll&&category!==coverCategory(project))throw new Error(`Para reemplazar la galería completa, empieza con ${categoryName(coverCategory(project))}.`);
 const oldImages=projectAssets(project.id).filter(asset=>asset.mime_type.startsWith('image/'));
 const imagesToRemove=replaceAll?oldImages:[];
 const existingPrimary=oldImages.find(asset=>asset.is_primary);
 const newlyUploadedPaths=[];
 const records=[];
 let committed=false;
 let preserveUploadedFiles=false;
 let cleanupWarning='';
 try{
  for(const file of files){
   const uploaded=await uploadFile(project,file);
   newlyUploadedPaths.push(uploaded.file_path);
   records.push({
    ...uploaded,
    category,
    category_label:category==='tipologia_departamento'?typology.trim():categoryName(category),
    created_by:currentUser.id,
    is_primary:(replaceAll||!existingPrimary)&&!records.length&&category===coverCategory(project)
   });
  }
  if(imagesToRemove.some(asset=>asset.is_primary)){
   const {error}=await supabase.from('project_assets').update({is_primary:false}).eq('project_id',project.id).eq('is_primary',true);
   if(error)throw new Error(`No se pudo preparar el cambio de portada: ${error.message}`);
  }
  const {data,error}=await supabase.from('project_assets').insert(records).select();
  if(error){
   if(imagesToRemove.some(asset=>asset.is_primary)&&existingPrimary){
    const {error:restoreError}=await supabase.from('project_assets').update({is_primary:true}).eq('id',existingPrimary.id);
    if(restoreError)throw new Error(`${error.message}. Además, no se pudo restaurar la portada anterior: ${restoreError.message}`);
   }
   throw new Error(`No se pudieron guardar los datos de las imágenes: ${error.message}`);
  }
  if(imagesToRemove.length){
   const {error:deleteError}=await supabase.from('project_assets').delete().in('id',imagesToRemove.map(asset=>asset.id));
   if(deleteError){
    const {error:rollbackError}=await supabase.from('project_assets').delete().in('id',data.map(asset=>asset.id));
    const {error:restoreError}=existingPrimary?await supabase.from('project_assets').update({is_primary:true}).eq('id',existingPrimary.id):{error:null};
    if(rollbackError){
     preserveUploadedFiles=true;
     throw new Error(`No se pudo reemplazar la galería: ${deleteError.message}. La reversión de metadatos falló (${rollbackError.message}); se conservaron los archivos nuevos para evitar enlaces rotos.${restoreError?` Falló también la restauración de la portada: ${restoreError.message}.`:''}`);
    }
    if(restoreError)throw new Error(`No se pudo reemplazar la galería: ${deleteError.message}. Falló la restauración de la portada: ${restoreError.message}`);
    throw new Error(`No se pudo reemplazar la galería: ${deleteError.message}`);
   }
   try{await removeStoredFiles(imagesToRemove.map(asset=>asset.file_path))}
   catch(error){cleanupWarning=error.message}
  }
  committed=true;
  try{await refreshAssets()}
  catch(error){throw new Error(`Las imágenes se guardaron, pero no se pudo actualizar la galería: ${error.message}`)}
  return cleanupWarning;
 }catch(error){
  if(newlyUploadedPaths.length&&!committed&&!preserveUploadedFiles)await removeStoredFiles(newlyUploadedPaths).catch(cleanupError=>{throw new Error(`${error.message}. Limpieza pendiente: ${cleanupError.message}`)});
  throw error;
 }
}
async function uploadPdfs(project,files){
 validateFiles(files,'pdf');
 const paths=[],records=[];
 let committed=false;
 try{
  for(const file of files){
   const uploaded=await uploadFile(project,file);
   paths.push(uploaded.file_path);
   records.push({...uploaded,category:'documento',category_label:file.name,created_by:currentUser.id,is_primary:false});
  }
  const {error}=await supabase.from('project_assets').insert(records);
  if(error)throw new Error(`No se pudieron guardar los datos de los PDF: ${error.message}`);
  committed=true;
  try{await refreshAssets()}
  catch(error){throw new Error(`Los PDF se guardaron, pero no se pudo actualizar la lista de documentos: ${error.message}`)}
 }catch(error){
  if(paths.length&&!committed)await removeStoredFiles(paths).catch(cleanupError=>{throw new Error(`${error.message}. Limpieza pendiente: ${cleanupError.message}`)});
  throw error;
 }
}
async function setPrimary(asset){
 if(!isProjectAdmin)throw new Error('Inicia sesión con una cuenta administradora para cambiar la portada.');
 const {error}=await supabase.rpc('set_project_primary_image',{asset_uuid:asset.id});
 if(error)throw new Error(`No se pudo cambiar la imagen principal: ${error.message}`);
 await refreshAssets();
}
async function renameImage(asset,newName){
 if(!isProjectAdmin)throw new Error('Inicia sesión con una cuenta administradora para cambiar el nombre.');
 const name=newName.trim();
 if(!name)throw new Error('El nombre de la imagen no puede estar vacío.');
 if(name.length>180)throw new Error('El nombre no puede superar los 180 caracteres.');
 const {data,error}=await supabase.from('project_assets').update({file_name:name}).eq('id',asset.id).select('id').maybeSingle();
 if(error)throw new Error(`No se pudo cambiar el nombre de la imagen: ${error.message}`);
 if(!data)throw new Error('No se encontró la imagen o no tienes permiso para cambiar su nombre.');
 try{await refreshAssets()}
 catch(error){throw new Error(`El nombre se guardó, pero no se pudo actualizar la galería: ${error.message}`)}
}
async function deleteAsset(asset){
 if(!isProjectAdmin)throw new Error('Inicia sesión con una cuenta administradora para eliminar archivos.');
 const {error}=await supabase.from('project_assets').delete().eq('id',asset.id);
 if(error)throw new Error(`No se pudo eliminar el archivo: ${error.message}`);
 const wasPrimary=asset.is_primary;
 let cleanupWarning='';
 try{await removeStoredFiles([asset.file_path])}
 catch(error){cleanupWarning=error.message}
 let primaryWarning='';
 if(wasPrimary){
  const replacement=projectAssets(asset.project_id).find(item=>item.id!==asset.id&&item.category===asset.category&&item.mime_type.startsWith('image/'));
  if(replacement){
   try{await setPrimary(replacement)}
   catch(error){primaryWarning=`No se pudo asignar una nueva imagen principal: ${error.message}`}
  }
 }
 try{await refreshAssets()}
 catch(error){throw new Error(`El archivo se eliminó, pero no se pudo actualizar la galería: ${error.message}`)}
 return [cleanupWarning,primaryWarning].filter(Boolean).join(' ');
}
function showAuthDialog(message=''){
 const modal=$('#modal');
 modal.innerHTML=`<form class="auth-card" id="auth-form"><h2>Acceso de administrador</h2><label>Correo electrónico<input id="auth-email" type="email" autocomplete="username" required></label><label>Contraseña<input id="auth-password" type="password" autocomplete="current-password" required></label><p id="auth-error" role="alert">${html(message)}</p><div class="auth-actions"><button class="secondary" id="auth-cancel" type="button">Cancelar</button><button type="submit">Iniciar sesión</button></div></form>`;
 modal.classList.add('open');
 $('#auth-cancel').onclick=closeModal;
 $('#auth-form').onsubmit=async event=>{
  event.preventDefault();
  const submit=event.currentTarget.querySelector('[type=submit]');
  submit.disabled=true;
  $('#auth-error').textContent='Verificando acceso…';
  try{
   const {error}=await supabase.auth.signInWithPassword({email:$('#auth-email').value.trim(),password:$('#auth-password').value});
   if(error)throw error;
   closeModal();
  }catch(error){
   $('#auth-error').textContent=`No se pudo iniciar sesión: ${error.message||'error de red'}`;
   submit.disabled=false;
  }
 };
}
function showRenameDialog(asset){
 const modal=$('#modal');
 modal.innerHTML=`<form class="auth-card" id="rename-form"><h2>Renombrar imagen</h2><label>Nombre<input id="rename-input" type="text" maxlength="180" value="${html(asset.file_name)}" required></label><p id="rename-error" role="alert"></p><div class="auth-actions"><button class="secondary" id="rename-cancel" type="button">Cancelar</button><button type="submit">Guardar</button></div></form>`;
 modal.classList.add('open');
 $('#rename-input').focus();
 $('#rename-input').select();
 $('#rename-cancel').onclick=closeModal;
 $('#rename-form').onsubmit=async event=>{
  event.preventDefault();
  const submit=event.currentTarget.querySelector('[type=submit]');
  submit.disabled=true;
  try{
   await renameImage(asset,$('#rename-input').value);
   closeModal();
   setStorageMessage('Nombre de imagen actualizado.');
   drawer();
  }catch(error){
   $('#rename-error').textContent=error.message;
   submit.disabled=false;
  }
 };
}
function galleryImageCard(project,asset){
 const primary=asset.is_primary,canBePrimary=asset.category===coverCategory(project)&&!primary;
 return `<div class="gallery-card"><button class="gallery-image" type="button" data-view-asset="${html(asset.id)}" aria-label="Abrir ${html(asset.file_name)}"><img alt="${html(asset.file_name)}" src="${html(publicFileUrl(asset))}">${primary?`<span class="cover-badge">Imagen principal · ${html(categoryName(asset.category))}</span>`:''}<span class="image-name">${html(asset.file_name)}</span></button>${isProjectAdmin?`<div class="image-actions">${canBePrimary?`<button type="button" data-primary-asset="${html(asset.id)}">Usar como portada</button>`:''}<button type="button" data-rename-asset="${html(asset.id)}">Renombrar</button><button class="delete-asset" type="button" data-delete-asset="${html(asset.id)}" aria-label="Eliminar ${html(asset.file_name)}">Eliminar</button></div>`:''}</div>`;
}
function galleryMarkup(project){
 return groupAssets(project).map(group=>`<section class="gallery-category"><h4>${html(group.label)}</h4>${group.assets.length?`<div class="gal">${group.assets.map(asset=>galleryImageCard(project,asset)).join('')}</div>`:`<p class="empty-category">Aún no hay imágenes en esta categoría.</p>`}</section>`).join('');
}
function drawer(){
 const p=P.find(project=>project.id===sel);
 if(!p)return;
 const dr=$('#drawer'),assets=projectAssets(p.id);
 const pdfs=assets.filter(asset=>asset.category==='documento');
 const categories=uploadCategories(p),cover=primaryImage(p);
 const coverMarkup=cover?`<button class="project-cover" type="button" data-view-asset="${html(cover.id)}"><img src="${html(publicFileUrl(cover))}" alt="${html(cover.file_name)}"><span>${html(cover.file_name)} · Imagen principal</span></button>`:'';
 dr.innerHTML=`<button class="close" id="x" type="button">Cerrar</button>${coverMarkup}<h2>${html(p.n)}</h2><div style="color:var(--mute)"><i class="dot" style="background:${COL[p.s]}"></i>${html(p.s)} · ${html(p.d)}</div><p class="project-location">${html(p.loc)}</p>
 <div class="facts"><div><small>Tipo</small><b>${html(p.t)}</b></div><div><small>Estado</small><b>${html(p.s)}</b></div><div><small>Precio</small><b>${html(p.pr||'Consultar')}</b></div><div><small>Área</small><b>${html(p.a)}</b></div></div>
 <h3>Galería</h3>${galleryMarkup(p)}
 ${pdfs.length?`<h3>Documentos</h3><div class="docs">${pdfs.map(asset=>`<div class="document-row"><button type="button" data-view-asset="${html(asset.id)}"><span class="tag">PDF</span>${html(asset.file_name)}</button>${isProjectAdmin?`<button class="delete-asset" type="button" data-delete-asset="${html(asset.id)}" aria-label="Eliminar ${html(asset.file_name)}">×</button>`:''}</div>`).join('')}</div>`:''}
 ${isProjectAdmin?`<form class="upload-form" id="asset-upload-form">
 <strong>Administrar archivos</strong>
 <label>Categoría de imágenes<select id="image-category">${categories.map(category=>`<option value="${category.value}" ${category.value===coverCategory(p)?'selected':''}>${html(category.label)}</option>`).join('')}</select></label>
 ${p.t==='Departamentos'?`<label id="typology-wrap" hidden>Tipología<input id="typology-label" type="text" maxlength="80" placeholder="Ej. 2 dormitorios"></label>`:''}
 <label>Imágenes de la categoría (puedes seleccionar varias)<input id="gallery-upload" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" multiple><span id="gallery-file-count" aria-live="polite"></span></label>
 <label class="replace-option"><input id="replace-gallery" type="checkbox">Reemplazar toda la galería de imágenes</label>
 <button class="upload-submit" type="submit">Guardar imágenes</button>
 <label>Agregar PDF (puedes seleccionar varios)<input id="pdf-upload" type="file" accept="application/pdf" multiple><span id="pdf-file-count" aria-live="polite"></span></label>
 <button class="upload-submit" id="save-pdfs" type="button">Guardar PDF</button>
 </form>`:''}
 ${storageMessage?`<p class="storage-error" role="status">${html(storageMessage)}</p>`:''}`;
 dr.classList.add('open');
 $('#x').onclick=()=>{sel=null;dr.classList.remove('open');renderAll()};
 dr.querySelectorAll('[data-view-asset]').forEach(button=>button.onclick=()=>{
  const asset=assets.find(item=>item.id===button.dataset.viewAsset);
  if(asset)show(asset.mime_type==='application/pdf'?'pdf':'img',publicFileUrl(asset),asset.file_name);
 });
 dr.querySelectorAll('[data-primary-asset]').forEach(button=>button.onclick=async()=>{
  const asset=assets.find(item=>item.id===button.dataset.primaryAsset);
  if(!asset)return;
  try{await setPrimary(asset);setStorageMessage('Imagen principal actualizada.')}
  catch(error){setStorageMessage(error.message);drawer()}
 });
 dr.querySelectorAll('[data-rename-asset]').forEach(button=>button.onclick=()=>{
  const asset=assets.find(item=>item.id===button.dataset.renameAsset);
  if(asset)showRenameDialog(asset);
 });
 dr.querySelectorAll('[data-delete-asset]').forEach(button=>button.onclick=async()=>{
  const asset=assets.find(item=>item.id===button.dataset.deleteAsset);
  if(!asset||!window.confirm(`¿Eliminar "${asset.file_name}" de forma permanente para todos?`))return;
  try{const cleanupWarning=await deleteAsset(asset);setStorageMessage(cleanupWarning||'Archivo eliminado.')}
  catch(error){setStorageMessage(error.message);drawer()}
 });
 if(!isProjectAdmin)return;
 $('#image-category').onchange=event=>{
  const wrap=$('#typology-wrap');
  if(wrap)wrap.hidden=event.target.value!=='tipologia_departamento';
 };
 $('#gallery-upload').onchange=event=>{
  selectedGalleryFiles=[...event.target.files];
  $('#gallery-file-count').textContent=selectedGalleryFiles.length?`${selectedGalleryFiles.length} imagen(es) seleccionada(s)`:'';
 };
 $('#pdf-upload').onchange=event=>{
  selectedPdfFiles=[...event.target.files];
  $('#pdf-file-count').textContent=selectedPdfFiles.length?`${selectedPdfFiles.length} PDF seleccionado(s)`:'';
 };
 $('#asset-upload-form').onsubmit=async event=>{
  event.preventDefault();
  try{
   const cleanupWarning=await uploadImages(p,selectedGalleryFiles,$('#image-category').value,$('#typology-label')?.value||'',$('#replace-gallery').checked);
   selectedGalleryFiles=[];
   setStorageMessage(cleanupWarning||'Imágenes guardadas y sincronizadas para todos los dispositivos.');
   drawer();
  }catch(error){setStorageMessage(error.message);drawer()}
 };
 $('#save-pdfs').onclick=async()=>{
  try{
   await uploadPdfs(p,selectedPdfFiles);
   selectedPdfFiles=[];
   setStorageMessage('PDF guardados y sincronizados para todos los dispositivos.');
   drawer();
  }catch(error){setStorageMessage(error.message);drawer()}
 };
}
function show(kind,source,title){
 closeModal();
 const url=source instanceof Blob?URL.createObjectURL(source):source;
 if(source instanceof Blob)modalObjectUrl=url;
 const m=$('#modal');
 m.innerHTML=`<div class="bar"><span>${html(title)}</span>${kind=='pdf'?`<a href="${url}" target="_blank" rel="noopener">Abrir en otra pestaña</a>`:''}<button id="mx">Cerrar</button></div><div class="box">${kind=='img'?`<img alt="${html(title)}" src="${url}">`:`<iframe title="${html(title)}" src="${url}"></iframe>`}</div>`;
 m.classList.add('open');$('#mx').onclick=closeModal;
}
function closeModal(){
 $('#modal').classList.remove('open');
 $('#modal').innerHTML='';
 if(modalObjectUrl){URL.revokeObjectURL(modalObjectUrl);modalObjectUrl=null}
}
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeModal()});
$('#account-button').onclick=async()=>{
 if(!supabase)return;
 if(!currentUser){showAuthDialog();return}
 try{
  const {error}=await supabase.auth.signOut();
  if(error)throw error;
 }catch(error){setStorageMessage(`No se pudo cerrar sesión: ${error.message||'error de red'}`)}
};
renderChips();renderAll();initializeCloud();
</script>
